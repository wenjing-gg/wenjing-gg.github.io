<script>
  window.__musicTracks = [
    {% assign music_tracks = site.static_files | where_exp: "item", "item.path contains '/music/'" | sort: "path" %}
    {% for item in music_tracks %}
    {
      title: {{ item.basename | jsonify }},
      src: {{ item.path | relative_url | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
</script>
<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>
<script defer src="{{ base_path }}/assets/js/cursor-effects.js"></script>

{% include analytics.html %}
