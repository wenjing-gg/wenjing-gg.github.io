<script>
  /* 首次访问（无手动语言选择）时判断默认语言：看「网络是否来自国外」。
     主判据：IP 归属地——geojs / ipwho.is 双接口并发，先答的算数；
     关键兜底：设备时区。挂代理时（Clash TUN/全局）geo 看到的是国外出口
     IP，但代理改不了系统时区——只要设备在中国时区（含港澳台）就给中文，
     IP 和时区都说在境外才给英文（真正的国外访客）。
     辅判据：geo 接口全挂时退回 google/gstatic generate_204 连通性探测
     （同样按时区兜底）；全部失败 3.2s 兜底中文。
     结果只进 sessionStorage（每个会话重测，跟着当前网络环境走）；
     手动切换写入 profileLocale.v1，永远优先于探测。
     探测在加载遮罩期间完成，页面渲染会等 __localeSettled，无闪变。 */
  (function () {
    var KEY = "profileLocale.v1";
    var AUTO = "profileLocaleAuto.v1";
    try {
      var manual = window.localStorage.getItem(KEY);
      if (manual === "zh" || manual === "en") {
        window.__localeSettled = true;
        return;
      }
    } catch (e) {}
    /* 探测进行中：profile-core / locale-toggle 等监听 locale:settled 再启动 */
    window.__localeDetectPending = true;
    var done = false;
    function finish(value) {
      if (done) return;
      done = true;
      try { window.sessionStorage.setItem(AUTO, value); } catch (e) {}
      window.__localeSettled = true;
      /* 消费者（profile-core/render/admin/publish、locale-toggle）都监听在
         window 上——必须由 window 派发（bubbles:false 时 document 派发到不了 window） */
      window.dispatchEvent(new CustomEvent("locale:settled", { detail: { locale: value } }));
    }
    /* 时区信号：中国时区（含港澳台）→ zh。IP 归属地 + 时区任一指向
       中国就 zh，两个都在境外才 en */
    var tz = "";
    try {
      tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    } catch (e) {}
    var TZ_ZH = {
      "Asia/Shanghai": 1, "Asia/Urumqi": 1, "Asia/Chongqing": 1,
      "Asia/Harbin": 1, "Asia/Kashgar": 1,
      "Asia/Hong_Kong": 1, "Asia/Macau": 1, "Asia/Taipei": 1
    };
    function judge(cc) {
      return cc === "CN" || TZ_ZH[tz] ? "zh" : "en";
    }
    var geoPending = 0;   /* 还没给出结论的 geo 接口数 */
    var googleOk = false; /* 辅判据：墙外连通性 */
    var googleFails = 0;
    /* geo 全挂时才启用辅判据：google 通 → 按时区定（中国时区 zh，否则 en）；
       google 也全挂 → zh */
    function geoFallback() {
      if (done || geoPending > 0) return;
      if (googleOk) finish(TZ_ZH[tz] ? "zh" : "en");
      else if (googleFails >= 2) finish("zh");
      /* 其余情况等 3.2s 兜底 */
    }
    function geo(url, pick) {
      geoPending += 1;
      var settled = false;
      var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timer = window.setTimeout(function () {
        if (settled) return;
        settled = true;
        if (ctrl) ctrl.abort();
        if (--geoPending === 0) geoFallback();
      }, 2600);
      try {
        fetch(url, { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (settled || done) return;
            settled = true; window.clearTimeout(timer);
            var cc = pick(j);
            if (cc) finish(judge(cc));
            else if (--geoPending === 0) geoFallback();
          })
          .catch(function () {
            if (settled) return;
            settled = true; window.clearTimeout(timer);
            if (--geoPending === 0) geoFallback();
          });
      } catch (e) {
        window.clearTimeout(timer);
        if (--geoPending === 0) geoFallback();
      }
    }
    geo("https://get.geojs.io/v1/ip/country.json", function (j) {
      j = Array.isArray(j) ? j[0] : j;
      return j && (j.country_code || j.country);
    });
    geo("https://ipwho.is/", function (j) {
      return j && (j.country_code || j.country);
    });
    function probe(url) {
      var settled = false;
      var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timer = window.setTimeout(function () {
        if (settled) return;
        settled = true;
        if (ctrl) ctrl.abort();
        if (++googleFails >= 2) geoFallback();
      }, 2600);
      try {
        fetch(url, { mode: "no-cors", cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
          .then(function () { settled = true; window.clearTimeout(timer); googleOk = true; geoFallback(); })
          .catch(function () {
            if (settled) return;
            settled = true; window.clearTimeout(timer);
            if (++googleFails >= 2) geoFallback();
          });
      } catch (e) {
        window.clearTimeout(timer);
        if (++googleFails >= 2) geoFallback();
      }
    }
    probe("https://www.google.com/generate_204?ts=" + Math.floor(Math.random() * 1e9));
    probe("https://www.gstatic.com/generate_204?ts=" + Math.floor(Math.random() * 1e9));
    /* 双保险：无论上面卡成什么样，3.2s 内必有结论（默认 zh） */
    window.setTimeout(function () { finish("zh"); }, 3200);
  })();
</script>
