{% include base_path %}

<div class="masthead guanmo-masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav guanmo-nav" aria-label="主导航">
        <button type="button" hidden aria-label="展开导航"><div class="navicon"></div></button>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item persist guanmo-nav-item"><a href="{{ domain }}{{ link.url }}" data-header-section="{{ link.url | split: '#' | last }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
